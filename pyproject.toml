[project]
name = "mcp-data"
version = "0.1.0"
description = "MCP_DATA: generic MCP server and client for querying databases (SQLite first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.34",
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "imageio>=2.37.3",
    "mcp>=1.28.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "plotnine>=0.15.7",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sf-hamilton>=1.90.0",
    "tqdm>=4.68.3",
    "uvicorn>=0.49.0",
    "dcor",
    "langchain>=1.3.10",
    "langchain-anthropic>=1.4.6",
    "langgraph>=1.2.6",
    "pyyaml>=6.0.3",
    "langchain-mcp-adapters>=0.3.0",
    "duckdb>=1.5.4",
]

[project.scripts]
db-mcp-server = "mcp_data.server.__main__:main"
db-mcp-client = "mcp_data.client.cli:main"
db-mcp-seed = "mcp_data.data.seed:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_data"]
