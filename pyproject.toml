[project]
name = "mcp-data"
version = "0.1.0"
description = "MCP_DATA: generic MCP server and client for querying databases (SQLite first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "mcp>=1.28.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotnine>=0.15.7",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sf-hamilton>=1.90.0",
    "tqdm>=4.68.3",
    "uvicorn>=0.49.0",
]

[project.scripts]
db-mcp-server = "mcp_sqlite.server.__main__:main"
db-mcp-client = "mcp_sqlite.client.cli:main"
db-mcp-seed = "mcp_sqlite.data.seed:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sqlite"]
